<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spotify 試聽播放器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🎧</span> 試聽播放器</div>
  <form id="loadForm" class="loadform">
    <input id="urlInput" type="text" placeholder="貼上 Spotify 歌單網址，例如 https://open.spotify.com/playlist/..." autocomplete="off" />
    <button type="submit" id="loadBtn" class="btn primary">載入並播放</button>
  </form>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-section">
      <div class="side-title">來源歌單</div>
      <div id="sourceItem" class="side-item disabled">尚未載入</div>
    </div>
    <div class="side-section">
      <div class="side-title">
        我的歌單
        <button id="newPlBtn" class="icon-btn" title="新增歌單">＋</button>
      </div>
      <div id="customList"></div>
    </div>
  </aside>

  <main class="main">
    <section id="emptyState" class="empty">
      <div class="empty-icon">🎵</div>
      <h2>貼上 Spotify 歌單網址開始聆聽</h2>
      <p>每首歌會自動播放 30 秒試聽，播完自動下一首。<br>按任何歌曲右邊的 <b>＋</b> 即可加入你的自訂歌單。</p>
      <button class="btn ghost" id="demoBtn">試試看：Today’s Top Hits</button>
    </section>

    <section id="viewSection" class="hidden">
      <div class="view-header">
        <img id="viewCover" class="view-cover" alt="" />
        <div class="view-meta">
          <div id="viewType" class="view-type">歌單</div>
          <h1 id="viewTitle"></h1>
          <div id="viewSub" class="view-sub"></div>
          <div class="view-actions">
            <button id="playAllBtn" class="btn primary round">▶ 播放全部</button>
            <button id="shuffleBtn" class="btn ghost round">🔀 隨機播放</button>
            <button id="renameBtn" class="btn ghost round hidden">✏️ 重新命名</button>
            <button id="deleteBtn" class="btn ghost round danger hidden">🗑 刪除歌單</button>
            <a id="openSpotify" class="btn ghost round hidden" target="_blank" rel="noopener">在 Spotify 開啟</a>
          </div>
        </div>
      </div>
      <div id="notice" class="notice hidden"></div>
      <div class="track-head">
        <span>#</span><span>標題</span><span class="col-dur">長度</span><span></span>
      </div>
      <ol id="trackList" class="tracks"></ol>
    </section>
  </main>
</div>

<footer class="player">
  <div class="now">
    <img id="nowCover" class="now-cover" alt="" />
    <div class="now-text">
      <div id="nowTitle" class="now-title">—</div>
      <div id="nowArtist" class="now-artist"></div>
    </div>
    <button id="nowAddBtn" class="icon-btn" title="加入歌單" disabled>＋</button>
  </div>
  <div class="controls">
    <div class="buttons">
      <button id="prevBtn" class="ctrl" title="上一首">⏮</button>
      <button id="playBtn" class="ctrl big" title="播放 / 暫停">▶</button>
      <button id="nextBtn" class="ctrl" title="下一首">⏭</button>
    </div>
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div id="progress" class="progress"><div id="progressFill" class="fill"></div></div>
      <span id="durTime">0:30</span>
    </div>
  </div>
  <div class="extra">
    <label class="toggle" title="播完自動下一首"><input type="checkbox" id="autoNext" checked /> 自動下一首</label>
    <span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
  </div>
</footer>

<div id="menu" class="menu hidden"></div>
<div id="toast" class="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
